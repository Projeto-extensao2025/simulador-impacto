<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Simulador de Impacto</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Simule seu impacto no meio ambiente</h1>

<p>Escolha suas ações:</p>

<div>
  <button onclick="acao(20)">Jogar lixo em terreno</button>
  <button onclick="acao(25)">Fazer queimadas</button>
  <button onclick="acao(-20)">Descartar corretamente</button>
  <button onclick="acao(-15)">Economizar água</button>
</div>

<h2 id="impacto">Impacto: 50</h2>
<h2 id="estado">⚠️ Atenção</h2>

<script src="script.js"></script>

</body>
</html>
